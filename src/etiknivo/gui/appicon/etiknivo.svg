<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#2747c9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square, with the standard 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- printer slot -->
  <rect x="210" y="262" width="604" height="44" rx="22" fill="#14256e" opacity="0.55"/>
  <!-- label coming out of the printer -->
  <g filter="url(#shadow)">
    <path d="M250 284 H774 V676 a40 40 0 0 1 -40 40 H290 a40 40 0 0 1 -40 -40 Z" fill="url(#paper)"/>
  </g>
  <!-- text lines: category, bold name, specification -->
  <rect x="402" y="374" width="220" height="30" rx="15" fill="#8a94ad"/>
  <rect x="318" y="446" width="388" height="96" rx="24" fill="#16203a"/>
  <rect x="362" y="586" width="300" height="34" rx="17" fill="#8a94ad"/>
</svg>
